name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Измените на вашу основную ветку

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Debug - show dist structure
        run: |
          echo "=== Dist structure ==="
          find dist -type f -name "*.html" || true
          echo "=== Full dist tree (first 50 lines) ==="
          find dist -type f | head -50 || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/tbank-calendar/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
