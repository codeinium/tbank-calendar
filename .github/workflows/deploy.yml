name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Измените на вашу основную ветку

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Debug - show dist structure
        run: |
          echo "=== Dist structure ==="
          find dist -type f -name "*.html" || true
          echo "=== Full dist tree ==="
          find dist -type d || true
          ls -la dist/ || true
          ls -la dist/*/ || true
          ls -la dist/*/*/ || true

      - name: Set upload path
        id: set-path
        run: |
          if [ -d "dist/browser" ]; then
            echo "UPLOAD_PATH=dist/browser" >> $GITHUB_OUTPUT
          elif [ -d "dist/tbank-calendar/browser" ]; then
            echo "UPLOAD_PATH=dist/tbank-calendar/browser" >> $GITHUB_OUTPUT
          else
            UPLOAD_PATH=$(find dist -name "index.html" -exec dirname {} \; | head -1)
            echo "UPLOAD_PATH=$UPLOAD_PATH" >> $GITHUB_OUTPUT
          fi
          echo "Upload path: ${{ steps.set-path.outputs.UPLOAD_PATH }}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.set-path.outputs.UPLOAD_PATH }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
