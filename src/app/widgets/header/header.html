<header class="fixed z-30 left-1/2 -translate-x-1/2 top-2 w-full max-w-[1702px] mx-auto min-h-[60px] px-8 bg-background rounded-xl flex justify-between items-center">
    <div class="w-full flex items-center justify-between">
    <nav class="h-full flex items-center gap-6">
      <ng-container *ngFor="let item of navigation">
        <a
          [routerLink]="item.to"
          routerLinkActive="active-link"
          #rla="routerLinkActive"
          class="text-base h-[3.4rem] flex items-center rounded-xl px-1 transition-colors duration-200"
          [class.bg-tui-text-primary]="rla.isActive"
          [class.text-tui-background-base]="rla.isActive"
          [style.color]="rla.isActive ? 'var(--tui-background-base)' : 'var(--tui-text-primary)'"
          [style.background-color]="rla.isActive ? 'var(--tui-text-primary)' : 'transparent'"
        >
          {{ item.label }}
        </a>
      </ng-container>
    </nav>
  </div>
</header>
