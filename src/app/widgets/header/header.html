<header
  class="w-full max-w-425.5 mx-auto min-h-15 px-8 fixed z-30 left-1/2 -translate-x-1/2 top-2 rounded-xl flex justify-between items-center bg-(--background) shadow-(--tui-shadow-m)"
>
  <div class="w-full flex items-center justify-between">
    <nav class="h-full flex items-center gap-6">
      <ng-container *ngFor="let item of navigation">
        <a
          [routerLink]="item.to"
          routerLinkActive="active-link"
          #rla="routerLinkActive"
          class="text-base h-[3.4rem] flex items-center rounded-xl px-1 transition-colors duration-200"
          [ngClass]="{
            'bg-(--foreground) text-(--background)': rla.isActive,
            'bg-(--background) text-(--foreground)': !rla.isActive,
          }"
        >
          {{ item.label }}
        </a>
      </ng-container>
    </nav>
  </div>
</header>
