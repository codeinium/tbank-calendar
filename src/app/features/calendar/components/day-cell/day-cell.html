<div [class]="heightClass()" (click)="openModal()">
  <div class="flex justify-between items-center truncate mb-1.5">
    <div
      class="px-1 h-full lg:h-8 rounded-sm lg:rounded-lg flex items-center justify-center text-base sm:text-xl lg:text-2xl"
      [ngClass]="isToday() ? 'bg-(--primary)' : ''"
    >
      {{ dayNumber() }}
    </div>
    
    @if (sumOfDay() !== 0) {
      <span class="text-xs sm:text-base lg:text-xl " [class]="sumClass()">
        {{ formatSum(sumOfDay()) }} ₽
      </span>
    }
  </div>

  <div class="flex flex-col gap-1 lg:gap-1.5">
    @for (transaction of displayedTransactions(); track transaction.id) {
      <app-transaction-card 
        [transaction]="transaction" 
        [variant]="view()" 
      />
    }
  </div>
  
  <div class="w-full mt-auto flex justify-center text-2xl">
    @if (hasMore()) {
      <span>...</span>
    }
  </div>
</div>
