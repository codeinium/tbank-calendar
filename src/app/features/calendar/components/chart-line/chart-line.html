@if (chartData().labels.length > 0) {
  <div class="flex flex-col mt-4 h-70 px-1">
    <canvas
      baseChart
      [data]="chartData()"
      [options]="chartOptions"
      [type]="'line'"
      class="w-full h-full"
    >
    </canvas>
  </div>
} @else {
  <p class="mt-3 text-base px-6.5">
    Нет данных для отображения
  </p>
}
