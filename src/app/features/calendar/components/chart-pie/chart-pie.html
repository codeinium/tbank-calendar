@if (chartData().labels.length > 0) {
  <div class="flex flex-col items-center mt-6 relative">
    <canvas
      baseChart
      [data]="chartData()"
      [options]="chartOptions"
      [type]="'doughnut'"
      class="w-44! h-44! drop-shadow-xl"
    ></canvas>

    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-xl">
      Траты
    </div>
  </div>

  @let vm = view();

  <div class="mt-5 flex gap-2 flex-wrap px-6.5">
    @for (item of vm.visible; track item.label) {
      <div class="flex items-center gap-1">
        <div
          class="w-3.25 h-3.25 rounded-2xl"
          [style.background]="item.color"
        ></div>
        <span class="text-base">{{ item.label }}</span>
      </div>
    }

    @if (vm.hasMore && !vm.expanded) {
      <button
        (click)="toggleExpand()"
        class="text-base font-medium cursor-pointer border-none text-(--primary) hover:text-(--tui-background-accent-1-hover)"
      >
        ... ({{ vm.remaining }})
      </button>
    }

    @if (vm.expanded) {
      <button
        (click)="toggleExpand()"
        class="text-base font-medium cursor-pointer border-none text-(--primary) hover:text-(--tui-background-accent-1-hover)"
      >
        Скрыть
      </button>
    }
  </div>
} @else {
  <p class="mt-3 text-base">Нет данных для отображения</p>
}
