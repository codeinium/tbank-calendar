<div class="px-5 py-3 rounded-(--tui-radius-l) bg-(--card-2) shadow-(--tui-shadow-m)">
  <p class="text-3xl mb-3">Цели</p>
  @for (goal of goals(); track goal.id) {
    <p class="w-40">{{ goal.name }}</p>
    <div class="flex items-center gap-2.5">
      <div class="flex-1 h-2.5 bg-(--primary) rounded-2xl overflow-hidden">
        <div class="h-full bg-(--foreground) rounded-2xl" [style.width.%]="progressPercent(goal)"></div>
      </div>
      <div class="text-base">{{ progressPercent(goal) }} %</div>
    </div>
  }
</div>
