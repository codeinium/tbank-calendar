<div class="px-7 py-3 rounded-(--tui-radius-l) shadow-(--tui-shadow-m)" [style.background-color]="bgColor">
  <h2 class="text-3xl">
    {{ title }}
  </h2>
  <div class="mt-2 flex justify-between">
    <p class="text-5xl">
      ₽{{ integerPart }}
      <span class="text-(--text-faded)">.{{ decimalPart }} </span>
    </p>
    <div
      class="p-2 flex items-center gap-1 rounded-(--tui-radius-l) shadow-(--tui-shadow-m)"
      [ngClass]="{
        'bg-(--income-background) text-(--income-dark)': isPositive,
        'bg-(--expense-background) text-(--expense-dark)': !isPositive,
      }"
    >
    @if (isPositive) {
      <img src="assets/icons/icon-arrow-top.svg" alt="icon arrow top" />
    } @else {
      <img src="assets/icons/icon-arrow-bottom.svg" alt="icon arrow bottom" />
    }
      <p class="text-xl">{{ percentChange }}%</p>
    </div>
    <div class="flex flex-col justify-between">
      <span class="flex items-center text-lg gap-2">
        <span class="h-4 w-4 rounded-full bg-(--primary)"></span>
        {{ transactionCount }} транзакций
      </span>
      <span class="flex items-center text-lg gap-2">
        <span class="h-4 w-4 rounded-full bg-(--primary)"></span>
        {{ categoryCount }} категорий
      </span>
    </div>
  </div>
  <p class="mt-7 text-lg text-(--text-faded)">Это {{labelIspositive}} на {{absDifferenceFromPreviousPeriod}} в сравнении с предыдущим периодом</p>
</div>
