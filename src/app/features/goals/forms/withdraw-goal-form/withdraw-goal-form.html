<form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-5">
  <label class="text-base">
    Сумма снятия

    <tui-textfield>
      <input
        tuiTextfield
        type="number"
        placeholder="Например: 5 000"
        formControlName="amount"
      />
    </tui-textfield>

    @if (form.get('amount')?.errors?.['required'] && form.get('amount')?.touched) {
      <p class="text-red-500">Введите сумму</p>
    }

    @if (form.get('amount')?.errors?.['min'] && form.get('amount')?.touched) {
      <p class="text-red-500">Сумма должна быть больше 0</p>
    }

    @if (form.get('amount')?.errors?.['backend']) {
      <p class="text-red-500">
        {{ form.get('amount')?.errors?.['backend'] }}
      </p>
    }
  </label>

  @if (formError()) {
    <p class="text-red-500">
      {{ formError() }}
    </p>
  }

  <div class="flex justify-center gap-4">
    <button tuiButton type="button" (click)="close.emit()">
      Отмена
    </button>

    <button tuiButton type="submit" [disabled]="form.invalid || formLoading()">
      Снять
    </button>
  </div>
</form>
