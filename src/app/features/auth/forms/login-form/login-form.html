<div class="flex flex-col gap-3">
  <h1 class="text-3xl">Вход</h1>

  <form [formGroup]="form" class="flex flex-col gap-3">
    <label class="text-base">
      Номер телефона
      <tui-textfield>
        <input
          tuiInputPhone
          autocomplete="tel"
          mask="+7 ### ###-##-##"
          formControlName="phone"
          placeholder="+ 7 (111) 222 33 44"
        />
      </tui-textfield>

      @if (form.get('phone')?.errors?.['required'] && form.get('phone')?.touched) {
        <p class="text-red-500 text-xs">Обязательное поле</p>
      }

      @if (form.get('phone')?.errors?.['backend']) {
        <p class="text-red-500 text-xs">
          {{ form.get('phone')?.errors?.['backend'] }}
        </p>
      }
      @if (form.get('phone')?.errors?.['phoneLength'] && form.get('phone')?.touched) {
        <p class="text-red-500 text-xs">Номер телефона должен содержать 11 цифр</p>
      }
    </label>

    <label class="text-base">
      Пароль
      <tui-textfield>
        <input tuiTextfield type="password" formControlName="password" />
        <tui-icon tuiPassword />
      </tui-textfield>

      @if (form.get('password')?.errors?.['required'] && form.get('password')?.touched) {
        <p class="text-red-500 text-xs">Обязательное поле</p>
      }

      @if (form.get('password')?.errors?.['backend']) {
        <p class="text-red-500 text-xs">
          {{ form.get('password')?.errors?.['backend'] }}
        </p>
      }
    </label>

    @if (authStore.error()) {
      <p class="text-red-500 text-xs">
        {{ authStore.error() }}
      </p>
    }
    <a routerLink="/reset-password"> Забыли пароль? </a>
    <button tuiButton type="button" (click)="submit()">Войти</button>
  </form>

  <p>
    Нет аккаунта?
    <a routerLink="/register" class="underline"> Зарегистрироваться </a>
  </p>
</div>
