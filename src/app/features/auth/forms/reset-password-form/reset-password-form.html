<div class="flex flex-col gap-3">
  <h1 class="text-3xl">Восстановление пароля</h1>

  @if (authStore.isEmailStep()) {
    <form [formGroup]="emailForm" class="flex flex-col gap-3">
      <label>
        Email

        <tui-textfield>
          <input tuiTextfield formControlName="email" />
        </tui-textfield>

        @if (showError(emailForm.get('email'), 'required')) {
          <p class="text-red-500 text-xs">
            Обязательное поле
          </p>
        }

        @if (showError(emailForm.get('email'), 'email')) {
          <p class="text-red-500 text-xs">
            Некорректный email
          </p>
        }

        @if (emailForm.get('email')?.errors?.['backend']) {
          <p class="text-red-500 text-xs">
            {{ emailForm.get('email')?.errors?.['backend'] }}
          </p>
        }
      </label>

      <button tuiButton type="button" (click)="sendCode()">
        Отправить код
      </button>
    </form>
  }

  @if (authStore.isConfirmStep()) {
    <form [formGroup]="confirmForm" class="flex flex-col gap-3">
      <label>
        Код подтверждения

        <tui-textfield>
          <input tuiTextfield formControlName="code" />
        </tui-textfield>

        @if (showError(confirmForm.get('code'), 'required')) {
          <p class="text-red-500 text-xs">
            Обязательное поле
          </p>
        }

        @if (confirmForm.get('code')?.errors?.['backend']) {
          <p class="text-red-500 text-xs">
            {{ confirmForm.get('code')?.errors?.['backend'] }}
          </p>
        }
      </label>

      <label>
        Новый пароль

        <tui-textfield>
          <input tuiTextfield type="password" formControlName="newPassword" />
          <tui-icon tuiPassword />
        </tui-textfield>

        @if (showError(confirmForm.get('newPassword'), 'required')) {
          <p class="text-red-500 text-xs">
            Обязательное поле
          </p>
        }

        @if (showError(confirmForm.get('newPassword'), 'minlength')) {
          <p class="text-red-500 text-xs">
            Минимум 8 символов
          </p>
        }

        @if (confirmForm.get('newPassword')?.errors?.['backend']) {
          <p class="text-red-500 text-xs">
            {{ confirmForm.get('newPassword')?.errors?.['backend'] }}
          </p>
        }
      </label>

      <button tuiButton type="button" (click)="confirm()">
        Сменить пароль
      </button>
    </form>
  }

  <button
  tuiButton
  type="button"
  appearance="secondary"
  (click)="backToLogin(); $event.preventDefault()"
>
  Назад ко входу
</button>
</div>
