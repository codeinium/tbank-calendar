@switch (variant) {
  @case ('month') {
    <div
      class="w-full flex flex-col sm:flex-wrap gap-2 h-full p-0.5 rounded-md lg:rounded-md text-xs lg:text-sm overflow-hidden"
      [ngClass]="
        isIncome
          ? 'bg-(--income-background) text-(--income-dark)'
          : 'bg-(--expense-background) text-(--expense-dark)'
      "
    >

      <p class="shrink-0">
        {{ amountLabel }} {{ categotyLabel }}
      </p>

      <p class="truncate min-w-0">
        {{ title }}
      </p>
    </div>
  }
  @case ('week') {
    <div
      class="lg:min-h-12 p-1 rounded-xs lg:rounded-md text-xs lg:text-sm break-all"
      [ngClass]="
        isIncome
          ? 'bg-(--income-background) text-(--income-dark)'
          : 'bg-(--expense-background) text-(--expense-dark)'
      "
    >
        <p class="shrink-0">
          {{ amountLabel }}
        </p>
        <p class="min-w-0 break-words">
          {{ title }}
        </p>

      <p class="wrap-break-words">
        {{ subtitle }}
      </p>
    </div>
  }
}
